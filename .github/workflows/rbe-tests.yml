name: RBE Tests

on:
  push:
    branches:
      - feature/rbe-selective-prediction
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rbe-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Reliability Boundary Engine tests
        run: python -m unittest discover -s tests -p "test_rbe.py" -v
